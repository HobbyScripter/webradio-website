name: CI

# The workflow only reads the repository. No job needs a write token.
permissions:
  contents: read

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Prisma skills
        run: npx prisma skills sync

      - name: Emit Prisma contract
        run: npm run prisma:contract:emit
        # Deliberately no database variables: `prisma contract emit` is offline
        # and prisma.config.ts must load without DIRECT_URL (regression guard).

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Prisma skills
        run: npx prisma skills sync

      - name: Emit Prisma contract
        run: npm run prisma:contract:emit
        # See the lint job: the config loads without credentials.

      - name: Run TypeScript check
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Unit/component tests do not connect to a database. The PostgreSQL
    # integration suite runs in the separate `integration` job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Prisma skills
        run: npx prisma skills sync

      - name: Emit Prisma contract
        run: npm run prisma:contract:emit
        # No DIRECT_URL on purpose: unit tests and contract emission stay offline.

      - name: Run tests
        run: npm test
        env:
          # DATABASE_URL is a loopback placeholder for unit tests that don't
          # need a real database (the documented local fallback; it is only
          # accepted outside production). DATABASE_URL_POOLED stays unset, so
          # the production path is not simulated here. Integration tests use
          # the PostgreSQL service container below.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/webradio_test
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000

      - name: Security audit
        # Prisma 8 RC ships transitive dev-deps (hono, lodash, valibot via
        # @prisma/composer-cli) with known high-severity issues that cannot be
        # fixed without downgrading Prisma. Audit at "critical" level only
        # until Prisma 8 reaches GA and these deps are updated upstream.
        # See docs/PHASE1_REPORT.md §10.1 and docs/SECURITY.md for details.
        run: npm audit --audit-level=critical

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Pin the image so local, CI and documented environments agree.
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webradio_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webradio_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable database for this job only; never a preview/production URL.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/webradio_ci_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/webradio_ci_test
      # DB-connected Prisma CLI operations (db migrate, db verify) use DIRECT_URL;
      # CI has no Prisma Postgres instance, so it points at the service container.
      # `contract emit` does not need it.
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/webradio_ci_test
      NEXTAUTH_SECRET: ci-integration-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Prisma skills
        run: npx prisma skills sync

      - name: Emit Prisma contract
        run: npm run prisma:contract:emit

      - name: Apply migrations to the CI database
        run: npm run db:migrate

      - name: Verify database marker and schema
        run: npm run db:verify

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Prisma skills
        run: npx prisma skills sync

      - name: Emit Prisma contract without credentials
        run: npm run prisma:contract:emit
        # No DIRECT_URL and no DATABASE_URL_POOLED: this is the exact state that
        # broke the Vercel build before the config stopped resolving eagerly.

      - name: Build
        run: npm run build
        env:
          # `prebuild` (prisma contract emit) runs again here and stays offline.
          # Exercise the production resolution path of the runtime client: only
          # the hostname is validated and the Prisma 8 pool is created lazily, so
          # the build never contacts this mock host. DATABASE_URL and DIRECT_URL
          # stay unset to prove there is no fallback and no build-time coupling.
          DATABASE_URL_POOLED: postgresql://placeholder:placeholder@pooled.db.prisma.io:5432/webradio_placeholder?sslmode=require
          NEXTAUTH_SECRET: ci-build-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
