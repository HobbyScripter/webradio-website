# Optional local PostgreSQL for development.
#
# This file only starts a development database. The full application stack
# (app + database) lives in `compose.yaml`; see docs/HOSTING_PORTABILITY.md.
#
# Verified with Docker Engine 29.9.3 / PostgreSQL 18 (see
# docs/PHASE_INFRA1.2_HOSTING_PORTABILITY_REPORT.md).
#
# Usage:
#   POSTGRES_PASSWORD="$(node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))")" \
#     docker compose up -d
#   docker compose exec postgres createdb -U postgres webradio_test
#
# Then set DATABASE_URL / TEST_DATABASE_URL accordingly. The port is bound to
# 127.0.0.1 only: the database is not reachable from the network.
services:
  postgres:
    image: postgres:18.4-alpine
    container_name: webradio-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the local dev database}
      POSTGRES_DB: webradio_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # postgres:18 keeps its cluster under /var/lib/postgresql (PGDATA is
      # /var/lib/postgresql/18/docker), not under .../data.
      - webradio_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webradio_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  webradio_pgdata:
